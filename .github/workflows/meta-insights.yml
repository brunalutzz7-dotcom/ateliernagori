name: Meta Insights -> Supabase

# Puxa as métricas dos anúncios da Meta (Instagram/Facebook) e grava no Supabase,
# que o painel de Marketing lê. Roda todo dia de manhã e também pode ser rodado à mão.
# Só funciona depois que os 4 secrets estiverem configurados em
#   Settings -> Secrets and variables -> Actions  (ver docs/marketing-meta-setup.md)

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia ~06h17 de Brasília (09h17 UTC)
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias puxar (use 90 na primeira carga)"
        required: false
        default: "7"

concurrency:
  group: meta-insights
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincronizar métricas da Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIAS: ${{ github.event.inputs.dias || '7' }}
        run: node scripts/meta-insights.mjs
